
services:
  api:
    image: ${API_IMAGE:-mini-crm-api:v1}
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  mlflow:
    image: mini-crm-mlflow:v1
    ports:
      - "127.0.0.1:5001:5000"

    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /tracking/mlartifacts

    volumes:
      - type: bind
        source: ./mlflow.db
        target: /tracking/mlflow.db

      - type: bind
        source: ./mlartifacts
        target: /tracking/mlartifacts
# 1. Utiliser ce réseau, nom logique utilisé
    networks:
      - crm_network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6

    restart: unless-stopped
# 2. Définir ce réseau
networks:
  crm_network:
    name: ${DOCKER_NETWORK_NAME:-mini-crm-network}

