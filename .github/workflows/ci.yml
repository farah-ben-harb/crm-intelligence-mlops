
name: Mini CRM - DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

  ml-training:
    name: ML Training and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install -r requirements-ml.txt

      - name: Validate dataset
        run: python ml/validate_data.py

      - name: Train and evaluate
        run: python -m ml.train

      - name: Upload validated model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
          if-no-files-found: error

  sast:
    name: Python SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan Python code
        run: bandit -r app ml -ll

  secrets:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  dependencies:
    name: Dependencies and IaC - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan dependencies and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep==1.185.0

      - name: Run Semgrep
        run: semgrep scan --config auto --error app ml

  dependency-audit:
    name: Python Dependencies - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: |
          pip-audit -r requirements-api.txt
          pip-audit -r requirements-ml.txt

  dockerfile-lint:
    name: Dockerfiles - Hadolint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile

      - name: Scan MLflow Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile.mlflow

  iac-check:
    name: Terraform - Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install checkov==3.4.4

      - name: Scan Terraform
        run: checkov -d terraform --quiet
  docker-build:
    name: Docker Build and Security Scan
    needs:
      - tests
      - ml-training
      - sast
      - secrets
      - dependencies
      - semgrep
      - dependency-audit
      - dockerfile-lint
      - iac-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download validated model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Build Docker image
        run: docker build -t mini-crm-api:ci .
            - name: Start API for ZAP
        run: |
          docker run -d \
            --name mini-crm-api-zap \
            -p 8000:8000 \
            mini-crm-api:ci

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs mini-crm-api-zap
          exit 1

      - name: OWASP ZAP Baseline
        run: |
          mkdir -p zap-report
          docker run --rm \
            --network host \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-report/zap-report.html

      - name: Stop API
        if: always()
        run: docker rm -f mini-crm-api-zap || true
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mini-crm-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish Docker image to GHCR
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download validated model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: ghcr.io/farah-ben-harb/mini-crm-api
          VERSION: sha-${{ github.sha }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${SOURCE}" \
            -t "${IMAGE}:${VERSION}" .

          docker push "${IMAGE}:${VERSION}"

