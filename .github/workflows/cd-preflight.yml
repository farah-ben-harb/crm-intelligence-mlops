name: Mini CRM - CD Preflight

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Immutable ECR image reference (repo@sha256:...)"
        required: true
        type: string
      model_key:
        description: "S3 candidate key (candidates/<git-sha>/model.joblib)"
        required: true
        type: string
      model_version:
        description: "S3 VersionId of the candidate model"
        required: true
        type: string
      model_sha256:
        description: "Expected model SHA-256"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate approved deployment inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate immutable references
        env:
          IMAGE: ${{ inputs.image }}
          MODEL_KEY: ${{ inputs.model_key }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_SHA256: ${{ inputs.model_sha256 }}
        run: |
          python - <<'PY'
          import os, re
          image = os.environ["IMAGE"]
          key = os.environ["MODEL_KEY"]
          version = os.environ["MODEL_VERSION"]
          sha = os.environ["MODEL_SHA256"]
          assert re.search(r"@sha256:[0-9a-f]{64}$", image), image
          assert re.fullmatch(r"candidates/[0-9a-f]{40}/model\.joblib", key), key
          assert version and re.fullmatch(r"[A-Za-z0-9._-]+", version), version
          assert re.fullmatch(r"[0-9a-fA-F]{64}", sha), sha
          print("CD_PREFLIGHT_OK")
          PY
      - name: Write immutable release input report
        env:
          IMAGE: ${{ inputs.image }}
          MODEL_KEY: ${{ inputs.model_key }}
          MODEL_VERSION: ${{ inputs.model_version }}
          MODEL_SHA256: ${{ inputs.model_sha256 }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("release-inputs.json").write_text(json.dumps({
              "image": os.environ["IMAGE"],
              "model_key": os.environ["MODEL_KEY"],
              "model_version": os.environ["MODEL_VERSION"],
              "model_sha256": os.environ["MODEL_SHA256"],
              "production_promotion": "not-executed",
          }, indent=2) + "\n")
          PY
      - name: Upload release input report
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs-${{ github.run_id }}
          path: release-inputs.json
      - name: Run local regression tests
        run: |
          python -m pip install -r requirements-api.txt -r requirements-dev.txt
          python -m pytest -q
          python -m ruff check .
